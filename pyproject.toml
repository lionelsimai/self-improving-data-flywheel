[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "self-improving-data-flywheel"
version = "0.1.0"
description = "Thumbs-down to synthetic data to LoRA fine-tune loop with measured eval delta"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Lionel Sim", email = "lionel@theaicapitol.com"}]
requires-python = ">=3.11"
keywords = ["ai-agents", "llm", "evaluation", "open-source"]
classifiers = ["Programming Language :: Python :: 3", "License :: OSI Approved :: MIT License"]
dependencies = []

[project.urls]
Homepage = "https://github.com/lionelsimai/self-improving-data-flywheel"
Repository = "https://github.com/lionelsimai/self-improving-data-flywheel"
Issues = "https://github.com/lionelsimai/self-improving-data-flywheel/issues"

[project.scripts]
flywheel = "data_flywheel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
